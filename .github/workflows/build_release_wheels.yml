name: Build and Release Wheels

on:
  push:
    branches: [main]
  workflow_dispatch:

# Don't let two pushes race to publish the same version tag.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build_and_release:
    name: Build wheel and publish release
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d
        with:
          python-version: "3.13"

      - name: Build wheel
        run: uv build --wheel

      - name: Read version from built wheel
        id: version
        run: |
          wheel=$(ls dist/*.whl)
          version=$(basename "$wheel" | cut -d '-' -f 2)
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "Built $wheel (version $version)"

      - name: Check whether this version is already released
        id: check
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="v${{ steps.version.outputs.version }}"
          draft=$(gh release view "$tag" --repo "$GITHUB_REPOSITORY" --json isDraft --jq '.isDraft' 2>/dev/null || echo "missing")
          case "$draft" in
            false)
              echo "exists=true" >> "$GITHUB_OUTPUT"
              echo "::notice::$tag is already published. Bump __version__ in src/dynamicprompts/__init__.py to publish a new one."
              ;;
            true)
              echo "exists=false" >> "$GITHUB_OUTPUT"
              echo "::notice::$tag exists as a draft; it will be updated and published."
              ;;
            *)
              echo "exists=false" >> "$GITHUB_OUTPUT"
              ;;
          esac

      - name: Create Release
        if: steps.check.outputs.exists == 'false'
        uses: softprops/action-gh-release@v3
        with:
          tag_name: v${{ steps.version.outputs.version }}
          name: v${{ steps.version.outputs.version }}
          body: |
            Pure-Python wheel build of the fork.

            Install with:

            ```
            pip install "dynamicprompts[attentiongrabber,magicprompt] @ https://github.com/${{ github.repository }}/releases/download/v${{ steps.version.outputs.version }}/dynamicprompts-${{ steps.version.outputs.version }}-py3-none-any.whl"
            ```

            **Commit:** ${{ github.sha }}
          draft: false
          prerelease: false
          make_latest: true
          files: dist/*.whl
