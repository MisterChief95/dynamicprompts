name: Build and Release Wheels

on:
  push:
    branches: [main]
  workflow_dispatch:

# Don't let two pushes race to publish the same version tag.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build_and_release:
    name: Build wheel and publish release
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up uv
        uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.13"

      - name: Build wheel
        run: uv build --wheel

      - name: Read version from built wheel
        id: version
        run: |
          wheel=$(ls dist/*.whl)
          version=$(basename "$wheel" | cut -d '-' -f 2)
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "Built $wheel (version $version)"

      - name: Check whether this version is already released
        id: check
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "v${{ steps.version.outputs.version }}" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo "::notice::v${{ steps.version.outputs.version }} is already released. Bump __version__ in src/dynamicprompts/__init__.py to publish a new one."
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Create Release
        if: steps.check.outputs.exists == 'false'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.version }}
          name: v${{ steps.version.outputs.version }}
          body: |
            Pure-Python wheel build of the fork.

            Install with:

            ```
            pip install "dynamicprompts[attentiongrabber,magicprompt] @ https://github.com/${{ github.repository }}/releases/download/v${{ steps.version.outputs.version }}/dynamicprompts-${{ steps.version.outputs.version }}-py3-none-any.whl"
            ```

            **Commit:** ${{ github.sha }}
          draft: false
          prerelease: false
          make_latest: true
          files: dist/*.whl
